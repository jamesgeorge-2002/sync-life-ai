<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ls-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="45%" stop-color="#7c3aed" />
      <stop offset="80%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <radialGradient id="ls-sheen" cx="30%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <filter id="ls-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle / App Icon Container -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#ls-grad)" />
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#ls-sheen)" />
  <rect x="2.5" y="2.5" width="59" height="59" rx="14.5" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1" fill="none" />

  <!-- LIFE-SYNC AI Sparkles Motif -->
  <g filter="url(#ls-glow)" fill="#ffffff" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Radiant 4-Point Star -->
    <path
      d="M32 14 C32.5 22 38 27.5 46 28 C38 28.5 32.5 34 32 42 C31.5 34 26 28.5 18 28 C26 27.5 31.5 22 32 14 Z"
      fill="#ffffff"
      stroke="#ffffff"
      stroke-width="0.8"
    />
    <!-- Top-Right Spark -->
    <path d="M48 12 L48 18 M45 15 L51 15" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" />
    <!-- Bottom-Left Radiant Sparkle -->
    <circle cx="17" cy="43" r="2.2" fill="#ffffff" stroke="none" />
  </g>
</svg>